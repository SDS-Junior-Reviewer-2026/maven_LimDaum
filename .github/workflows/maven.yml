name: Email Test

on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Clone
      - uses: actions/checkout@v4

    # 2. AWS CLI 로그인 하기
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credential@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ap-northeast-2
    # 3. AWS CLI를 이용하여, AWS SES 서비스로 이메일 전송하기
    # 무조건 
      - name: Send Email with SES
        run: |
          aws ses send-email \
          --from "mincoding@naver.com" \
          --destination "ToAddress=dlaekdna4862@gmail.com" \
          --message "Subject={Data=테스트 메일 전송}, Body={Text={Data=안녕? KFC from GitHub Actions}}"
